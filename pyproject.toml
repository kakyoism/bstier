[tool.poetry]
name = "bstier"
version = "0.1.0"
description = "Brawl Stars tierlist helper"
authors = ["Beinan Li <li.beinan@gmail.com>"]
license = "MIT"
readme = "README.md"

[[tool.poetry.packages]]
include = "*"
from = "src"

[tool.poetry.dependencies]
python = "^3.11"
kkpyutil = "*"
numpy = "*"
opencv-python = "*"
pillow = "*"

[tool.poetry.scripts]
bstier = "src.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
